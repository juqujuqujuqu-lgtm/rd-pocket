<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RD Pocket">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <title>RD Pocket</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-left" id="navLeft"></div>
    <div class="nav-title" id="navTitle"></div>
    <div class="nav-right" id="navRight"></div>
  </header>

  <main id="viewport"><div id="view" class="page"></div></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="nummern">
      <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <span>Nummern</span></button>
    <button data-tab="codes">
      <svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16 7l3 3M14 9l2 2"/></svg>
      <span>Schlüssel</span></button>
    <button data-tab="algo">
      <svg viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="5" rx="1.2"/><rect x="2.5" y="16.5" width="7" height="5" rx="1.2"/><rect x="14.5" y="16.5" width="7" height="5" rx="1.2"/><path d="M12 7.5v4.5M6 16.5V12h12v4.5"/></svg>
      <span>Algorithmen</span></button>
    <button data-tab="tools">
      <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>Tools</span></button>
    <button data-tab="pzc">
      <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M10 9h4M12 7v4M9 21v-5h6v5"/></svg>
      <span>PZC</span></button>
    <button data-tab="kinder">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M8 11h8M9 22l3-7 3 7"/></svg>
      <span>Kinder</span></button>
    <button data-tab="schema">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg>
      <span>Schemata</span></button>
  </nav>

  <div id="pagerLayer" class="pager-layer" aria-hidden="true"></div>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- iOS 18+: Klick auf ein switch-Label löst ein haptisches Feedback aus -->
  <label id="hapticLabel" class="sr-only" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <script src="data.js"></script>
  <script src="algos-k.js"></script>
  <script src="algos-m.js"></script>
  <script src="algos-v.js"></script>
  <script src="algo.js"></script>
  <script src="app.js"></script>
</body>
</html>
